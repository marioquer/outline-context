<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Tree</title>
    <meta name="description" content="A semantic context switcher for long-running LLM conversations. STAY · SWITCH · FORK." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23231d18'/%3E%3Cpath d='M10 9v14M10 12h7M10 20h7M17 12v0M20 12h3M20 20h3' stroke='%23fbf8f3' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('ct-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
